{% extends "base_form.html" %} {% block title %}Zarejestruj się | Book Track{%
endblock %}
<div class="auth-container">
  <div class="auth-box">
    <div class="auth-header">
      <h1>Utwórz konto</h1>
      <a href="/" class="back-link">← Wróć</a>
    </div>

    <form>
      <label for="email">Adres e-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Wprowadź e-mail"
      />

      <label for="username">Nazwa użytkownika</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Wprowadź nazwę użytkownika"
      />

      <label for="password">Hasło</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Wprowadź hasło"
      />

      <label for="password-confirm">Potwierdź hasło</label>
      <input
        type="password"
        id="password-confirm"
        name="password-confirm"
        placeholder="Potwierdź hasło"
      />

      <a href="{{ url_for('auth.register_step2') }}">Dalej</a>
    </form>
  </div>
</div>
