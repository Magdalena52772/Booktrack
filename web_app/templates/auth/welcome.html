{% extends "base_form.html" %} {% block form_content %}
{% if messages %}
  {% for message in messages %}
    <div class="alert alert-danger" role="alert">{{ message }}</div>
  {% endfor %}
{% endif %}
<form action="{% url 'auth_welcome' %}" method="POST" class="needs-validation">
  {% csrf_token %}
  <div class="mb-3">
    <label for="email" class="form-label">Podaj e-mail</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="email"
      placeholder="Twój e-mail"
      required
    />
  </div>
  <button type="submit" class="btn btn-primary w-100">Dalej</button>
</form>
{% endblock %}
